# LapVisualizer — PostgreSQL database, API server and the nginx-served web UI.
# Credentials are interpolated from the git-ignored `.env` file; nothing
# sensitive is hardcoded here. Start everything with: docker compose up --build
# (web UI at http://localhost:8080, API at http://localhost:8000).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
    restart: unless-stopped
    # Pass the whole .env into the container, then override the database host:
    # within the compose network PostgreSQL is reached at the "db" service.
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8000:8000

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - 8080:80

volumes:
  db-data:
